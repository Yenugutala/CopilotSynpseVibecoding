name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate specs and SQL conventions
        run: python3 tools/build_synapse.py validate

      - name: Synapse JSON is in sync with SQL (no hand edits)
        run: python3 tools/build_synapse.py check

      - name: No secrets in code
        run: |
          if grep -rInE "(AccountKey=|SharedAccessSignature|sig=[A-Za-z0-9%]{20,}|password\s*=\s*['\"][^'\"]+|api[-_]?key\s*[:=]\s*['\"][A-Za-z0-9]{16,})" \
               --include="*.sql" --include="*.json" --include="*.yaml" --include="*.yml" --include="*.py" \
               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::Possible secret found. Use managed identity instead."
            exit 1
          fi
          echo "No secrets found."

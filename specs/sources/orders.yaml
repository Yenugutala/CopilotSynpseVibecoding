table: orders
description: Customer orders, one row per order line, exported from the order system.
source_file: orders.csv
format:
  delimiter: ","
  header: true
  encoding: UTF-8
# order_id is the only column that identifies an order; the file has one product per order.
business_key: [order_id]

columns:
  - name: order_id
    type: INT
    nullable: false
    description: Unique order identifier.
  - name: customer_id
    type: INT
    nullable: false
    description: Customer who placed the order. References customers.customer_id.
  - name: order_date
    type: DATE
    nullable: false
    description: Date the order was placed (YYYY-MM-DD).
  - name: product
    type: VARCHAR(100)
    nullable: false
    description: Name of the product ordered.
  - name: quantity
    type: INT
    nullable: false
    description: Number of units ordered. Must be at least 1.
  - name: unit_price
    type: DECIMAL(10,2)
    nullable: false
    description: Price per unit. Must not be negative.
  - name: status
    type: VARCHAR(20)
    nullable: false
    description: Order lifecycle status. TODO confirm the full list of statuses.

dq_rules:
  - name: order_id_not_null
    column: order_id
    check: not_null
    action: reject
  - name: order_id_valid
    column: order_id
    check: valid_type
    action: reject
  - name: customer_id_not_null
    column: customer_id
    check: not_null
    action: reject
  - name: order_date_not_null
    column: order_date
    check: not_null
    action: reject
  - name: order_date_valid
    column: order_date
    check: valid_type
    action: reject
  - name: product_not_null
    column: product
    check: not_null
    action: reject
  - name: quantity_not_null
    column: quantity
    check: not_null
    action: reject
  - name: quantity_min
    column: quantity
    check: min_value
    value: 1
    action: reject
  - name: unit_price_not_null
    column: unit_price
    check: not_null
    action: reject
  - name: unit_price_min
    column: unit_price
    check: min_value
    value: 0
    action: reject
  - name: status_allowed
    column: status
    check: allowed_values
    values: [PLACED, SHIPPED, DELIVERED, CANCELLED, RETURNED]
    action: reject
  - name: customer_exists
    column: customer_id
    check: references
    ref_table: customers
    ref_column: customer_id
    action: warn

table: customers
description: Customer master list with contact details and signup date, delivered as a CSV extract.
source_file: customers.csv
format:
  delimiter: ","
  header: true
  encoding: UTF-8
business_key: [customer_id]

columns:
  - name: customer_id
    type: INT
    nullable: false
    description: Unique customer identifier.
  - name: first_name
    type: VARCHAR(100)
    nullable: false
    description: Customer given name.
  - name: last_name
    type: VARCHAR(100)
    nullable: false
    description: Customer family name.
  - name: email
    type: VARCHAR(255)
    nullable: false
    description: Customer email address. TODO confirm whether email is mandatory and unique per customer.
  - name: country
    type: VARCHAR(2)
    nullable: false
    description: Two-letter ISO 3166-1 alpha-2 country code.
  - name: signup_date
    type: DATE
    nullable: false
    description: Date the customer signed up (YYYY-MM-DD).

dq_rules:
  - name: customer_id_not_null
    column: customer_id
    check: not_null
    action: reject
  - name: customer_id_valid
    column: customer_id
    check: valid_type
    action: reject
  - name: first_name_not_null
    column: first_name
    check: not_null
    action: reject
  - name: last_name_not_null
    column: last_name
    check: not_null
    action: reject
  - name: email_not_null
    column: email
    check: not_null
    action: reject
  - name: email_format
    column: email
    check: regex
    pattern: "%_@_%._%"
    action: reject
  - name: country_not_null
    column: country
    check: not_null
    action: reject
  - name: country_max_length
    column: country
    check: max_length
    value: 2
    action: reject
  - name: signup_date_not_null
    column: signup_date
    check: not_null
    action: reject
  - name: signup_date_valid
    column: signup_date
    check: valid_type
    action: reject
